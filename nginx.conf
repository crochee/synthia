# Nginx configuration for synthia-web.
# Serves the React SPA and reverse-proxies /api and /a2a to
# synthia-server. The /a2a location disables proxy buffering
# to support Server-Sent Events streaming from the A2A service.

upstream synthia_backend {
    server server:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Long cache for hashed assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every unknown path serves index.html
    # so React Router can handle client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # REST management API
    location /api/ {
        proxy_pass http://synthia_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # A2A protocol — supports JSON-RPC and SSE streaming.
    # `proxy_buffering off` is REQUIRED for SSE: nginx would
    # otherwise buffer SSE frames and the browser would never
    # see partial updates.
    location /a2a/ {
        proxy_pass http://synthia_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # Health check
    location /health {
        proxy_pass http://synthia_backend/health;
        proxy_set_header Host $host;
    }

    # WebSocket approvals (kept for parity with existing UI)
    location /ws/ {
        proxy_pass http://synthia_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
