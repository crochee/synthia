name: OTel Feature Matrix

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  otel-feature-matrix:
    name: OTel Feature Compilation Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-otel-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-otel-
            ${{ runner.os }}-cargo-

      # 13.1 — synthia-telemetry compiles with zero OTel deps when feature is off.
      - name: Check synthia-telemetry without otel feature
        run: cargo check --no-default-features -p synthia-telemetry

      # 13.2 — synthia-telemetry compiles with full OTel pipeline enabled.
      - name: Check synthia-telemetry with otel feature
        run: cargo check --features otel -p synthia-telemetry

      # 13.3 — OTel-gated unit/integration tests pass.
      - name: Test synthia-telemetry with otel feature
        run: cargo test --features otel -p synthia-telemetry

      # 13.4 — synthia-agent span integration compiles when otel is enabled.
      - name: Check synthia-agent with otel feature
        run: cargo check --features otel -p synthia-agent
