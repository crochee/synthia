name: rust-quality

# The repo's own quality gates, run where they cannot be skipped.
#
# Every step here is a `make` target, so a contributor reproduces CI
# locally by running the same command, and the gate list lives in one
# place (the Makefile) instead of in YAML. `cargo test --workspace` is
# deliberately absent — AGENTS.md §3.3 requires per-module batches, and
# `make test-crates` walks the members one at a time.
#
# No API keys are needed: the suite is credential-free by design, and
# the examples run offline.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: rust-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  gates:
    name: fmt + clippy + rustdoc + dependency invariants
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install nightly toolchain (rustfmt.toml requires nightly fmt)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-quality-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-quality-
            ${{ runner.os }}-cargo-

      - name: cargo fetch
        run: cargo fetch

      # `make ci` = fmt-check, clippy, doc-check (rustdoc warnings are
      # errors), the compiled-guide doctests, MVP-dependency gate,
      # runtime-free gate, public-API runtime gate, pub-surface ratchet,
      # claim-language gate, clock ratchet, harness-shape gate, and the
      # test-layout ratchet.
      - name: fmt, clippy, rustdoc, dependency + layout + shape invariants
        run: make ci

  tests:
    name: per-crate tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-tests-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tests-
            ${{ runner.os }}-cargo-

      - name: cargo fetch
        run: cargo fetch

      - name: every member, one crate at a time
        run: make test-crates

      - name: optional SQLite memory tier
        run: make test-sqlite

      # The facade's `MINIMAL.md` doctests live in `make ci` (the
      # `test-guides` target), not here: `doc-check` only *generates*
      # docs, so a broken recipe in the guide needs a target that
      # actually compiles examples, and running it in the `gates` job
      # means a contributor catches it locally too. Duplicating the two
      # commands here would run them twice per CI run for no coverage.

  examples:
    name: examples + consumer proofs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-examples-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-examples-
            ${{ runner.os }}-cargo-

      - name: cargo fetch
        run: cargo fetch

      - name: every example, plus both standalone consumer crates
        run: make examples

  web:
    name: frontend gates (types, lint, format)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # The single frontend lock (R72 consolidated four into this
          # one; `synthia-web` is no longer an npm workspace member).
          cache-dependency-path: synthia-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: synthia-web
        run: npm ci

      # No browser needed: AGENTS.md §4 requires 0 lint and formatting,
      # and `tsc --noEmit` is what catches an API-shape change on the
      # Rust side. Frontend behaviour is verified with Playwright MCP
      # against the running app (AGENTS.md §4.2); there is no browser
      # suite in CI by design (R72).
      - name: types, lint, formatting
        run: make check-web

  bench:
    name: performance invariants
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-
            ${{ runner.os }}-cargo-

      - name: cargo fetch
        run: cargo fetch

      # Ratios, not absolutes: each pair is measured in one process, so
      # the factor holds on any runner. `make bench` prints the full
      # table for a human; this gate fails when a memoised path loses its
      # advantage (a cache that stopped hitting, or a scan reintroduced).
      - name: hot-path ratios (memo vs the work it replaced)
        run: make bench-check
