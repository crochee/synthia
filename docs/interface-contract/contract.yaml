  - id: GET /a2a/tasks/{key}:subscribe
    method: GET
    path: /a2a/tasks/{key}:subscribe
    source: both
    notes: |
      Fix card #003. The SSE endpoint is served by the A2A REST
      router mounted under `/a2a` via `nest_service` in
      `crates/synthia-server/src/server/router.rs`; the scanner
      cannot see it directly because the route table lives in the
      `a2a-server-lf` crate. Wire events are emitted by
      `crates/synthia-server/src/a2a/mapping.rs::agent_event_to_stream_responses`
      as protojson `StreamResponse::StatusUpdate` payloads, then
      serialised onto the SSE stream by `a2a_server::sse::sse_from_stream`.
      Per `docs/interface-contract/ARBITRATION.md` priority 2
      (`@a2a-js/sdk` types > Synthia stable spec) the wire shape is
      fixed by the SDK's `TaskStatusUpdateEvent` proto; the enum
      values for `status.state` are exactly:
        TASK_STATE_UNSPECIFIED, TASK_STATE_SUBMITTED, TASK_STATE_WORKING,
        TASK_STATE_COMPLETED, TASK_STATE_FAILED, TASK_STATE_CANCELED,
        TASK_STATE_INPUT_REQUIRED, TASK_STATE_REJECTED,
        TASK_STATE_AUTH_REQUIRED.
      Any unknown state value reaching the wire is downgraded to
      `TASK_STATE_FAILED` by the backend (with `tracing::warn!`)
      so the SSE stream stays alive; the frontend reducer
      (`synthia-web/src/pages/ChatPage.tsx::normalizeTaskState`)
      logs `console.error` for unknown values but does not throw.
      Fix card #008. Cadence: the Synthia internal SSE stream
      (`/api/sessions/{id}/stream`) sends heartbeat comments
      (`: ping`) every 15 seconds. The A2A SSE stream
      (`tasks/{id}:subscribe`) is managed by `a2a-server-lf`
      which does not currently emit heartbeats or `Retry-After`
      headers. Reconnect logic: the `@a2a-js/sdk` client exposes
      `resubscribeTask()`; the frontend should implement
      exponential backoff on stream disconnect. The cadence
      `max_idle_ms` is effectively 30000 (2× heartbeat interval)
      for the internal stream; the A2A stream cadence is
      SDK-dependent.
    source_files:
      backend:
        - /home/crochee/workspace/synthia/.worktrees/synthia-interface-contract-closure-cycle-2/crates/synthia-server/src/a2a/mapping.rs:75
        - /home/crochee/workspace/synthia/.worktrees/synthia-interface-contract-closure-cycle-2/crates/synthia-server/src/a2a/service.rs:39
      frontend:
        - /home/crochee/workspace/synthia/.worktrees/synthia-interface-contract-closure-cycle-2/synthia-web/src/api/a2a-stream.ts:338
        - /home/crochee/workspace/synthia/.worktrees/synthia-interface-contract-closure-cycle-2/synthia-web/src/pages/ChatPage.tsx:849
    sse_events:
      - name: status-update
        fields:
          - taskId
          - contextId
          - status.state
        notes: |
          `status.state` is the `@a2a-js/sdk@1.0.0` `TaskState` enum
          serialised via `taskStateToJSON` (string form, e.g.
          `TASK_STATE_WORKING`). The full enum set is fixed by the
          SDK and must not be silently truncated; see `notes` above.
      - name: artifact-update
        fields:
          - taskId
          - contextId
          - artifact.artifactId
          - artifact.parts
          - lastChunk
          - append
        notes: |
          Fix card #004. The `artifact-update` event carries an
          `artifact` with its `artifactId`, `parts`, and metadata.
          Per `@a2a-js/sdk@1.0.0` `TaskArtifactUpdateEvent`, the
          `lastChunk` field (serialised from proto `last_chunk`)
          indicates whether this is the final chunk of the artifact.
          The backend sets `lastChunk: true` for atomic tool results
          (no streaming chunk assembly); `append: false` means the
          artifact is standalone, not appended to a previous one.
          The frontend reducer reads `lastChunk` to decide when to
          flush accumulated content. Missing `lastChunk` should be
          treated as `true` (assume complete if absent).
