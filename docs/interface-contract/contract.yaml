    source: both
    notes: |
      Fix card #006. The cancel endpoint is served by the A2A JSON-RPC
      router mounted under `/a2a` via `nest_service` in
      `crates/synthia-server/src/server/router.rs`; the scanner
      cannot see it directly because the route table lives in the
      `a2a-server-lf` crate. The handler (`a2a-server-lf::cancel_task`)
      calls `SynthiaExecutor::cancel()` which issues
      `SessionController::cancel()` and yields
      `StreamResponse::Task(TaskState::Canceled)`. Terminal-state tasks
      return `A2AError::task_not_cancelable`; non-existent tasks return
      `A2AError::task_not_found`. The operation is idempotent: cancelling
      an already-cancelled task returns the stored task unchanged.
