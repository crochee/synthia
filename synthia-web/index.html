<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Synthia — modular AI Agent framework (Reasoning + Acting)." />
    <meta name="theme-color" content="#2563eb" />
    <title>Synthia AI Agent</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        /*
         * Inline pre-load font stack — matches tokens.css so the
         * first paint doesn't flash in a different family before
         * the external stylesheet arrives.
         */
        font-family:
          'Inter var',
          'Inter',
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
        background: #fafafa;
        color: #18181b;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }
      #root {
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
