<?xml version="1.0" encoding="UTF-8"?>
<!--
  Synthia — symbol-only mark.
  Used where the wordmark is redundant (favicons, app tiles, avatars,
  loading spinners). Designed on a 32x32 viewBox; render at any size.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 32 32"
     role="img"
     aria-label="Synthia">
  <title>Synthia</title>

  <!-- Outer ring -->
  <circle cx="16" cy="16" r="14"
          fill="none"
          stroke="#2563eb"
          stroke-width="2.5"/>
  <!-- Inner solid disc, offset right to form the "eye / orbit" silhouette -->
  <circle cx="22" cy="16" r="7"
          fill="#2563eb"/>
  <!-- Cyan arc accent -->
  <path d="M 16 2 A 14 14 0 0 1 30 16"
        fill="none"
        stroke="#0891b2"
        stroke-width="2.5"
        stroke-linecap="round"/>
</svg>