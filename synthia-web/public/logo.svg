<?xml version="1.0" encoding="UTF-8"?>
<!--
  Synthia primary logo lockup (symbol + wordmark).

  Render guarantee: the wordmark is a hand-built SVG text element.
  The font stack falls back through Inter, system-ui and Arial so the
  glyphs render even when the named font is not installed; the mark
  itself is path-based and has no font dependency. When this file is
  embedded as `img src=...logo.svg` from the React Header or the
  GitHub README, the SVG document is parsed by the host renderer and
  inherits its font environment, so the wordmark renders in practice
  on every modern browser.

  Colour notes:
    * symbol fill / stroke : #2563eb  (= brand-primary)
    * cyan arc accent      : #0891b2  (= brand-accent)
    * wordmark ink         : currentColor; flips with theme via
                              `color: var(brand-wordmark)` in CSS
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 220 48"
     role="img"
     aria-label="Synthia">
  <title>Synthia</title>

  <g transform="translate(8, 8)">
    <circle cx="16" cy="16" r="14"
            fill="none"
            stroke="#2563eb"
            stroke-width="2.5"/>
    <circle cx="22" cy="16" r="7"
            fill="#2563eb"/>
    <path d="M 16 2 A 14 14 0 0 1 30 16"
          fill="none"
          stroke="#0891b2"
          stroke-width="2.5"
          stroke-linecap="round"/>
  </g>

  <g transform="translate(48, 0)"
     font-family="'Inter var','Inter',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"
     font-weight="700"
     font-size="20"
     letter-spacing="2"
     fill="currentColor">
    <text x="0" y="31">SYNTHIA</text>
  </g>
</svg>