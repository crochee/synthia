<?xml version="1.0" encoding="UTF-8"?>
<!--
  Synthia — square favicon.
  Tightened for tab/address-bar legibility: same mark geometry as
  logo-mark.svg but inside a 32x32 viewBox with no padding, so the
  shape fills the available pixel budget at 16px / 32px favicon sizes.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 32 32"
     role="img"
     aria-label="Synthia">
  <title>Synthia</title>

  <!-- Solid background tile so the mark reads on any browser tab color.
       Falls back to transparent if the host strips the rect. -->
  <rect x="0" y="0" width="32" height="32" rx="6" fill="#ffffff"/>
  <g transform="translate(2, 2)">
    <circle cx="14" cy="14" r="12"
            fill="none"
            stroke="#2563eb"
            stroke-width="2.5"/>
    <circle cx="20" cy="14" r="6"
            fill="#2563eb"/>
    <path d="M 14 2 A 12 12 0 0 1 26 14"
          fill="none"
          stroke="#0891b2"
          stroke-width="2.5"
          stroke-linecap="round"/>
  </g>
</svg>