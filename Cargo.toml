[workspace]
members = [
    "crates/synthia-core",
    "crates/synthia-telemetry",
    "crates/synthia-provider",
    "crates/synthia-tool",
    "crates/synthia-skill",
    "crates/synthia-session",
    "crates/synthia-agent",
    "crates/synthia-server",
    "test-support",
]
resolver = "2"

[workspace.dependencies]
synthia-core = { path = "crates/synthia-core" }
synthia-telemetry = { path = "crates/synthia-telemetry" }
synthia-provider = { path = "crates/synthia-provider" }
synthia-tool = { path = "crates/synthia-tool" }
synthia-skill = { path = "crates/synthia-skill" }
synthia-session = { path = "crates/synthia-session" }
synthia-agent = { path = "crates/synthia-agent" }
synthia-server = { path = "crates/synthia-server" }
test-support = { path = "test-support" }

# Async runtime
tokio = { version = "1.53", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
schemars = { version = "1.2", features = ["derive", "preserve_order"] }
schemars_derive = "1.2"

# Error handling
anyhow = "1.0"
thiserror = "2.0"
validator = { version = "0.21", features = ["derive"] }

# Utilities
ulid = { version = "3.0", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.24", features = ["v4", "serde"] }
indexmap = "2.14"
parking_lot = "0.12"

# HTTP server
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors", "fs"] }
http = "1.5"

# HTTP client
reqwest = { version = "0.13", features = ["json", "stream"] }

# Tracing pillars, feature sets centralized here so every crate opts in to
# exactly what the code uses (default-features = false on the OTel /
# tracing-subscriber families). The three telemetry pillars:
#   - logging  → tracing + tracing-subscriber (fmt / ansi console + env-filter)
#   - traces   → opentelemetry OTLP (tonic gRPC + reqwest HTTP transports,
#                TLS for `https://` gRPC endpoints; metrics/logs signals off)
#   - metrics  → prometheus (text exposition only; protobuf / push off)
# Crate-level feature gates (`otel`, `metrics`) live in
# `crates/synthia-telemetry/Cargo.toml` and re-export through downstream
# crates that opt into observability.
tracing = { version = "0.1", default-features = false, features = [
  "std",
  "attributes",
] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "ansi",
  "env-filter",
] }
opentelemetry = { version = "0.32", default-features = false, features = [
  "trace",
] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = [
  "trace",
  "rt-tokio",
  "experimental_trace_batch_span_processor_with_async_runtime",
] }
opentelemetry-semantic-conventions = { version = "0.32", features = [
  "semconv_experimental",
] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
  "trace",
  "grpc-tonic",
  "http-proto",
  "reqwest-client",
  "tls-ring",
  "tls-webpki-roots",
] }
tracing-opentelemetry = { version = "0.33", default-features = false }
prometheus = { version = "0.14", default-features = false }
lazy_static = "1.5"

# Encoding
base64 = "0.22"

# Additional utilities
dashmap = "6.2"
regex = "1.13"
sha2 = "0.10"
hex = "0.4"
tokio-tungstenite = "0.29"

# Testing
tempfile = "3.8"
wiremock = "0.6"
dotenvy = "0.15"
http-body-util = "0.1"

# CLI
clap = { version = "4.6", features = ["derive"] }

# YAML parsing
serde_yaml = "0.9"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

# --- Release profile ---
#
# Optimised for low-latency request handling on a single
# long-lived server process. Compared to Cargo's defaults we:
#   - drop `debug` symbols (`0` ⇒ fastest link, smallest binary).
#     Profile-guided optimisation requires symbols so we keep
#     `1` if/when PGO is wired in; until then `0` wins on
#     cold-start time and RSS, which is the metric that matters
#     for a chat server that streams many small responses.
#   - enable thin LTO (`"thin"`) — full LTO gives ~5% throughput
#     on hot paths but blows the build time from minutes to hours;
#     thin LTO is the sweet spot for a server binary that still
#     builds in seconds.
#   - set `codegen-units = 1` so the compiler can inline across
#     crate boundaries (the LTO step). The default of 16 enables
#     faster parallel compilation but leaves ~10% of optimisations
#     on the table.
#   - bump `opt-level = 3` (Cargo's default) to keep the
#     tightest scalar / loop optimisations on.
#
# `panic = "abort"` is intentionally left at the default
# ("unwind") — turning it to abort would shrink the binary by a
# few hundred KB at the cost of an opaque crash dump, and the
# server-side middleware already converts panics to JSON 500s
# before they ever reach the unwinder (see
# `middleware/error_handler.rs`).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 0
strip = "symbols"
