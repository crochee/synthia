[workspace]
members = [
    "crates/synthia-core",
    "crates/synthia-telemetry",
    "crates/synthia-hook",
    "crates/synthia-provider",
    "crates/synthia-context",
    "crates/synthia-tool",
    "crates/synthia-permission",
    "crates/synthia-tool-orchestrator",
    "crates/synthia-sandbox",
    "crates/synthia-tool-bash",
    "crates/synthia-tool-exec-base",
    "crates/synthia-exec",
    "crates/synthia-mcp",
    "crates/synthia-command",
    "crates/synthia-skill",
    "crates/synthia-session",
    "crates/synthia-memory",
    "crates/synthia-task",
    "crates/synthia-agent",
    "crates/synthia-evaluation",
    "crates/synthia-cli",
    "crates/synthia-server",
    "crates/synthia-job",
    "crates/synthia-e2e",
    "crates/synthia-plugin",
    "crates/synthia-message-proxy",
    "crates/synthia-cache-mark",
    "crates/synthia-protocol",
    "crates/synthia-session-v2",
    "test-support",
]
resolver = "2"

[package]
name = "synthia-examples"
version.workspace = true
edition.workspace = true

[dependencies]
synthia-agent = { path = "crates/synthia-agent" }
synthia-provider = { path = "crates/synthia-provider" }
synthia-tool = { path = "crates/synthia-tool" }
synthia-skill = { path = "crates/synthia-skill" }
synthia-context = { path = "crates/synthia-context" }
synthia-hook = { path = "crates/synthia-hook" }
synthia-session = { path = "crates/synthia-session" }
synthia-plugin = { path = "crates/synthia-plugin" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
test-support = { path = "test-support" }
tokio.workspace = true
futures.workspace = true
serde_json.workspace = true
tokio-util.workspace = true
dotenv = "0.15"
anyhow.workspace = true

[workspace.dependencies]
synthia-core = { path = "crates/synthia-core" }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Utilities
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
indexmap = "2"
parking_lot = "0.12"

# HTTP server
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
hyper = "1"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }
percent-encoding = "2"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.27"
opentelemetry-otlp = "0.27"
tracing-opentelemetry = "0.28"

# MCP
rmcp = { version = "0.1", features = ["server", "client", "transport-child-process"] }

# Schema
schemars = "0.8"

# Additional utilities
dashmap = "5"
regex = "1"
glob = "0.3"
lazy_static = "1"
sha2 = "0.10"
hex = "0.4"
tokio-tungstenite = "0.24"
semver = "1"

# Testing
mockall = "0.13"
tempfile = "3"
wiremock = "0.6"
rand = "0.8"
dotenv = "0.15"
http-body-util = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
rustyline = "15"

# Database (for memory cold storage)
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# YAML parsing
serde_yaml = "0.9"

# File watching
notify = "7"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dev-dependencies]
synthia-hook = { path = "crates/synthia-hook" }
synthia-tool = { path = "crates/synthia-tool" }
synthia-provider = { path = "crates/synthia-provider" }
synthia-telemetry = { path = "crates/synthia-telemetry" }
synthia-memory = { path = "crates/synthia-memory" }
tokio.workspace = true
futures.workspace = true
serde_json.workspace = true
serde.workspace = true
async-trait.workspace = true
tempfile.workspace = true
