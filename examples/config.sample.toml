# Synthia Configuration Sample
# This file demonstrates all available configuration options based on config.rs

version = "1.0"

[providers.anthropic]
api_key = "${ANTHROPIC_API_KEY}"
base_url = "https://api.anthropic.com"
supports_streaming = true

[[providers.anthropic.models]]
name = "claude-sonnet-4-20250514"
context_window = 200000
description = "Claude Sonnet 4 - balanced model"

[providers.anthropic.models.capabilities]
vision = true
tool_use = true

[[providers.anthropic.models]]
name = "claude-3-haiku-20240307"
context_window = 200000
description = "Fast and efficient model"

[providers.anthropic.models.capabilities]
vision = true

[providers.openai]
api_key = "${OPENAI_API_KEY}"
base_url = "https://api.openai.com/v1"
supports_streaming = true

[[providers.openai.models]]
name = "gpt-4o"
context_window = 128000
description = "GPT-4 Omni - latest multimodal model"
temperature = 0.7
max_tokens = 4096

[providers.openai.models.capabilities]
vision = true
tool_use = true

[[providers.openai.models]]
name = "gpt-4o-mini"
context_window = 128000
description = "Fast and cost-effective model"

[providers.ollama]
base_url = "http://localhost:11434"
supports_streaming = true

[[providers.ollama.models]]
name = "llama3"
context_window = 8192
description = "Llama 3 model"

[[providers.ollama.models]]
name = "codellama"
context_window = 16384
description = "Code Llama model"

[mcps.filesystem]
type = "stdio"
description = "File system operations"
command = "synthia-mcp-filesystem --root ./workspace"
timeout = 300
enabled = true

[mcps.filesystem.env]
LOG_LEVEL = "info"

[mcps.fetch]
type = "stdio"
description = "Fetch remote files and URLs"
command = "synthia-mcp-fetch"
timeout = 60
enabled = true

[agents.default]
description = "Main coding agent for general tasks"
max_steps = 100
color = "#4A90D9"

agents.default.allowed_tools = [
    "read_file",
    "write_file",
    "glob",
    "grep",
    "search_codebase"
]

agents.default.denied_tools = [
    "delete_file",
    "execute_command"
]

[agents.explore]
description = "Read-only agent for code exploration"
hidden = false

agents.explore.allowed_tools = [
    "read_file",
    "glob",
    "grep",
    "search_codebase"
]

[agents.code]
description = "Full-featured coding agent"
max_steps = 50
color = "#50C878"

agents.code.allowed_tools = [
    "read_file",
    "write_file",
    "delete_file",
    "execute_command",
    "glob",
    "grep",
    "search_codebase",
    "create_directory"
]