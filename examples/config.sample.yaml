# Synthia Configuration Sample
# This file demonstrates all available configuration options based on config.rs

$schema: "https://synthia.ai/config.json"
version: "1.0"

providers:
  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"
    base_url: "https://api.anthropic.com"
    supports_streaming: true
    models:
      - name: "claude-sonnet-4-20250514"
        context_window: 200000
        description: "Claude Sonnet 4 - balanced model"
        capabilities:
          vision: true
          tool_use: true
      - name: "claude-3-haiku-20240307"
        context_window: 200000
        description: "Fast and efficient model"
        capabilities:
          vision: true

  openai:
    api_key: "${OPENAI_API_KEY}"
    base_url: "https://api.openai.com/v1"
    supports_streaming: true
    models:
      - name: "gpt-4o"
        context_window: 128000
        description: "GPT-4 Omni - latest multimodal model"
        capabilities:
          vision: true
          tool_use: true
        temperature: 0.7
        max_tokens: 4096
      - name: "gpt-4o-mini"
        context_window: 128000
        description: "Fast and cost-effective model"

  ollama:
    base_url: "http://localhost:11434"
    supports_streaming: true
    models:
      - name: "llama3"
        context_window: 8192
        description: "Llama 3 model"
      - name: "codellama"
        context_window: 16384
        description: "Code Llama model"

mcps:
  filesystem:
    type: "stdio"
    description: "File system operations"
    command: "synthia-mcp-filesystem --root ./workspace"
    env:
      LOG_LEVEL: "info"
    timeout: 300
    enabled: true

  fetch:
    type: "stdio"
    description: "Fetch remote files and URLs"
    command: "synthia-mcp-fetch"
    timeout: 60
    enabled: true

agents:
  default:
    description: "Main coding agent for general tasks"
    allowed_tools:
      - "read_file"
      - "write_file"
      - "glob"
      - "grep"
      - "search_codebase"
    denied_tools:
      - "delete_file"
      - "execute_command"
    max_steps: 100
    color: "#4A90D9"

  explore:
    description: "Read-only agent for code exploration"
    allowed_tools:
      - "read_file"
      - "glob"
      - "grep"
      - "search_codebase"
    hidden: false

  code:
    description: "Full-featured coding agent"
    allowed_tools:
      - "read_file"
      - "write_file"
      - "delete_file"
      - "execute_command"
      - "glob"
      - "grep"
      - "search_codebase"
      - "create_directory"
    max_steps: 50
    color: "#50C878"
