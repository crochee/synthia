# Docker Compose for synthia PRODUCTION deployment.
#
# Architecture:
#   - server: synthia-server binary (Rust) on internal :8080
#   - web: Nginx serving built React app on :80
#     + reverse-proxying /api to server
#
# Browser hits Nginx on :80. Only Nginx port is exposed.

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: synthia-server:latest
    container_name: synthia-server
    expose:
      - "8080"
    environment:
      - RUST_LOG=warn
      - SYNTHIA_HOST=0.0.0.0
      - SYNTHIA_PORT=8080
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: synthia-web:latest
    container_name: synthia-web
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
