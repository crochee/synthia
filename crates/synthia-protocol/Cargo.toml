[package]
name = "synthia-protocol"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Wire protocol types for synthia CLI/server/IDE clients"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
opentelemetry = { version = "0.27", optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }

[features]
default = []
otel = ["dep:opentelemetry", "dep:tracing-opentelemetry"]

[dev-dependencies]
pretty_assertions = "1"
