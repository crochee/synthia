[package]
name = "synthia-context"
version.workspace = true
edition.workspace = true

[dependencies]
synthia-core = { path = "../synthia-core" }
synthia-provider = { path = "../synthia-provider" }
synthia-skill = { path = "../synthia-skill" }
synthia-cache-mark = { path = "../synthia-cache-mark" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
chrono.workspace = true
uuid.workspace = true
anyhow.workspace = true
sys-locale = "0.3"
regex.workspace = true
sha2.workspace = true
parking_lot.workspace = true
tracing.workspace = true
blake3 = "1"
ulid.workspace = true
ahash = "0.8"
tokio = { workspace = true, features = ["fs", "rt"] }
opentelemetry = { workspace = true, optional = true }

[features]
default = []
# Enable OpenTelemetry `compaction` span creation at the compaction
# trigger entry. When enabled, `compact_messages` emits a `compaction`
# tracing span with `compaction.before_tokens` / `after_tokens` /
# `stage` / `messages_before` / `messages_after` attributes. No-op
# (compile-time eliminated) when disabled.
# Also enables OTel counter emission in `pruning::engine::prune`
# (`synthia.pruning.marked_count` / `kept_tokens` / `scanned_count`).
otel = ["dep:opentelemetry"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile.workspace = true
filetime = "0.2"
tracing-subscriber.workspace = true
