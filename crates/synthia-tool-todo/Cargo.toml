[package]
name = "synthia-tool-todo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The `TodoWrite` builtin: structured task-list state the model can maintain"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
synthia-tool.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true

[dev-dependencies]
# `#[tokio::test]`/`#[tokio::main]` need `macros` + `rt`;
# `#[tokio::main]` defaults to the multi-thread runtime.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
# Tests assert on `ToolOutput` content parts.
synthia-provider.workspace = true
