[package]
name = "synthia-cli"
version.workspace = true
edition.workspace = true
description = "Synthia CLI - Interactive chat tool with streaming support"

[[bin]]
name = "synthia-cli"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
futures.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
uuid.workspace = true
dotenv.workspace = true
regex.workspace = true
once_cell.workspace = true
futures-util.workspace = true
rmcp.workspace = true
base64.workspace = true
image.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
clap = { version = "4.5", features = ["derive", "env"] }
synthia-provider = { path = "../synthia-provider" }
synthia-agent = { path = "../synthia-agent" }
synthia-job = { path = "../synthia-job" }
synthia-tracing = { path = "../synthia-tracing" }

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
unreachable_pub = "allow"
