[package]
name = "synthia-session-v2"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Part-based session storage (opencode V2 message model)"
license = "MIT"

[dependencies]
synthia-protocol = { path = "../synthia-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync", "time", "macros"] }

[features]
default = []

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"