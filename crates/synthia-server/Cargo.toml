[package]
name = "synthia-server"
version.workspace = true
edition.workspace = true

[dependencies]
synthia-agent = { path = "../synthia-agent" }
synthia-command = { path = "../synthia-command" }
synthia-context = { path = "../synthia-context" }
synthia-hook = { path = "../synthia-hook" }
synthia-job = { path = "../synthia-job" }
synthia-mcp = { path = "../synthia-mcp" }
synthia-permission = { path = "../synthia-permission" }
synthia-tool-orchestrator = { path = "../synthia-tool-orchestrator" }
synthia-sandbox = { path = "../synthia-sandbox" }
synthia-provider = { path = "../synthia-provider" }
synthia-session = { path = "../synthia-session" }
synthia-core = { path = "../synthia-core" }
synthia-tool = { path = "../synthia-tool" }
synthia-protocol = { path = "../synthia-protocol" }
async-trait.workspace = true
chrono.workspace = true
axum.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["cors", "fs"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
base64 = "0.22"
thiserror.workspace = true
tracing.workspace = true
futures.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
async-stream.workspace = true
dashmap.workspace = true
serde_yaml.workspace = true
rmcp = { workspace = true }
dotenv = "0.15"
clap = { version = "4.5", features = ["derive"] }
uuid = { workspace = true, features = ["v4"] }
sha2.workspace = true
hex.workspace = true
test-support = { path = "../../test-support", optional = true }

[features]
test-utils = ["dep:test-support"]
unified-registry = ["synthia-agent/unified-registry"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
tempfile.workspace = true
http-body-util.workspace = true
tower = { workspace = true, features = ["util"] }
axum.workspace = true
test-support = { path = "../../test-support" }
filetime = "0.2"
chrono.workspace = true
serial_test = "3"
tokio-tungstenite.workspace = true

[dev-dependencies.synthia-server]
path = "."
features = ["test-utils"]
