[package]
name = "synthia-server"
version.workspace = true
edition.workspace = true

[features]
# Only `test-utils` remains. Observability is no longer feature-gated on
# this crate: OTel OTLP tracing, Prometheus RED metrics, the
# `/metrics` endpoint, and the `track_metrics` middleware are all
# always-on. The fallback to console tracing when neither gRPC nor
# HTTP OTLP is configured lives inside `synthia_telemetry::init_tracing`.
test-utils = ["dep:test-support"]

[dependencies]
synthia-agent.workspace = true
synthia-provider.workspace = true
synthia-session.workspace = true
synthia-skill.workspace = true
synthia-core.workspace = true
validator.workspace = true
synthia-telemetry.workspace = true
synthia-tool.workspace = true
async-trait.workspace = true
chrono.workspace = true
axum.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["cors", "fs"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
tracing.workspace = true
futures.workspace = true
tokio-util.workspace = true
async-stream.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
serde_yaml.workspace = true
dotenvy.workspace = true
clap = { version = "4.6", features = ["derive"] }
uuid = { workspace = true, features = ["v4"] }
sha2.workspace = true
hex.workspace = true
base64.workspace = true
regex.workspace = true
schemars.workspace = true
prometheus.workspace = true
test-support = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
tempfile.workspace = true
http-body-util.workspace = true
tower = { workspace = true, features = ["util"] }
axum.workspace = true
test-support.workspace = true
chrono.workspace = true

[dev-dependencies.synthia-server]
path = "."
features = ["test-utils"]