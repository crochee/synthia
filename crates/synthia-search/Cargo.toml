[package]
name = "synthia-search"
description = "Generic multi-domain search engine: BM25 + vector hybrid, pluggable tokenizer / embedder / vector store / filter / reranker, thread-safe, cross-T registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
provider = ["dep:synthia-provider"]

[dependencies]
synthia-core.workspace = true
synthia-provider = { workspace = true, default-features = false, optional = true }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures.workspace = true
# `ErasedEngine::search_erased` is an async trait method so adapter
# engines over async retrievers (session full-text, memory recall)
# join the cross-domain `Registry::search` without a blocking
# bridge. Runtime-neutral: no executor, no runtime types.
async-trait.workspace = true
[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
chrono.workspace = true
tempfile.workspace = true
