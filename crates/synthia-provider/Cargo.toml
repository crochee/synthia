[package]
name = "synthia-provider"
description = "Model provider trait, wire types, and built-in Anthropic / OpenAI-compatible adapters for synthia"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
[dependencies]
synthia-core = { workspace = true, features = ["tokio-util"] }
async-trait.workspace = true
# `rc` feature enables `Serialize`/`Deserialize` for `Arc<T>` so that
# `CompletionRequest`'s `Arc<Vec<T>>` fields derive serde impls that
# produce/consume the same JSON array format as `Vec<T>`.
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
futures.workspace = true
# Only the HTTP adapters need an HTTP client, so `reqwest` is optional
# and enabled by the `anthropic` / `openai` features. A consumer who
# implements `ModelProvider` themselves compiles no HTTP stack at all.
reqwest = { workspace = true, optional = true }
# `macros` = `tokio::select!` in the SSE pump; `time` = the retry
# backoff and the per-read idle timeout. No `rt`: the adapters await
# the caller's runtime, they never spawn.
tokio = { workspace = true, features = ["macros", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
# `ResourceLink::prompt_projection` decodes an inline `text/*` payload
# into a prompt, which only the two adapters ever do, so `base64` is
# optional and rides the same features as `reqwest` — a consumer with
# their own provider compiles no decoder either.
base64 = { workspace = true, optional = true }
parking_lot.workspace = true
tracing.workspace = true
ulid.workspace = true
chrono.workspace = true
regex.workspace = true
toml.workspace = true
ahash = "0.8"
thiserror.workspace = true

[features]
# The two shipped adapters. Each one carries `reqwest` and its
# transport stack (hyper / rustls / h2 / …), so a consumer with their
# own provider turns both off:
#
# ```toml
# synthia-provider = { version = "0.1", default-features = false }
# ```
#
# The rest of the crate — the `ModelProvider` trait, the wire types,
# the token estimator, the typed `ProviderProfile` data, the retry
# classifier, `json_repair` — compiles either way.
default = ["anthropic", "openai"]
# Each adapter turns on `synthia-core/reqwest` — the
# `From<reqwest::Error> for Error` impl they `?` through — so a build
# with no adapter has no HTTP error type either.
anthropic = ["dep:reqwest", "dep:base64", "synthia-core/reqwest"]
openai = ["dep:reqwest", "dep:base64", "synthia-core/reqwest"]
# Enable OpenTelemetry `llm.call` span creation at provider call sites.
# When enabled, `AnthropicProvider::complete` / `OpenAICompatibleProvider::complete`
# (and their `complete_with_stream` variants) emit a `llm.call` tracing span
# with `gen_ai.*` semantic-convention attributes. No-op when disabled, and
# irrelevant when both adapters are off.
otel = []

[dev-dependencies]
# Tests spawn tasks and use channels on a real runtime; `macros`/`time`
# come from the lib's own feature set.
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
wiremock.workspace = true
futures.workspace = true
tracing-subscriber.workspace = true
serial_test = "4.0"