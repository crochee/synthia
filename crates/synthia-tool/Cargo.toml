[package]
name = "synthia-tool"
version.workspace = true
edition.workspace = true

[dependencies]
synthia-core.workspace = true
synthia-provider.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = { workspace = true, features = ["preserve_order"] }
# schemars 1.2.2 has a `#[cfg(feature = "schemars_derive")]` gate on
# its `pub use schemars_derive::*`, but that gate is broken: Cargo
# only forwards `feature="default"` to the rustc invocation, so the
# `schemars_derive` feature is never activated for transitive
# consumers. We depend on the derive crate directly and import the
# macro via `use schemars_derive::JsonSchema`. Remove the direct
# dep once upstream aligns the gate with the documented `derive`
# feature name.
schemars_derive.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
reqwest.workspace = true
url = "2.5"
parking_lot.workspace = true
chrono.workspace = true
futures.workspace = true

[dev-dependencies]
tempfile.workspace = true
test-support.workspace = true
tracing-subscriber.workspace = true

[features]
default = []